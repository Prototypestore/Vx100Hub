</head>
<body>
<header>
  <div class="logo">VX</div>
  <!-- Hamburger -->
  <button class="menu-btn" aria-label="Menu">
    <svg class="hamburger" viewBox="0 0 24 24" width="28" height="28">
      <path d="M4 7H20"/>
      <path d="M4 12H20"/>
      <path d="M4 17H20"/>
    </svg>

  <!-- Nav -->
  <nav>
    <ul>

      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>
<main>
  <form id="form">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required placeholder="Your Name">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required placeholder="Your email">
    <label for="phone">Phone (optional)</label>
    <input type="tel" id="phone" name="phone" placeholder="Optional" maxlength="10" pattern="[1-9]{10}">
    <label for="service">Service</label>
    <select id="service" name="service" required>
      <option value="" disabled selected>Select a service</option>
      <option value="web-development">Web Development</option>
      <option value="web-animations">UI Motion & Animation</option>
      <option value="api-integration">API Integration</option>
      <option value="analytics-google">Tracking & Optimization</option>
    </select>
    <label for="message">Additional Details</label>
    <textarea id="message" name="message" placeholder="Any extra info..."></textarea>
    <div id="form-message"></div>
    <button type="submit">Submit</button>
  </form>
</main>
  <footer>
  <div id="mail">
    <h2>WhatsApp Us:</h2>

  </div>
  <p>© 2025 Vx100Hub. All Rights Reserved.</p>
</footer>
  <script src="script.js"></script>
  <script src="https://cdn.email.js.com/dist/email.min.js"></script>
  <script src="contact.js" defer></script>
</body>
</html>
